# Vuelve a publicar el sitio todos los días para que la lista de documentos de Transparencia
# se genere de nuevo desde Drive (eso ocurre en Vercel, al publicar; la lista nunca se guarda en
# este repositorio). Necesita el secreto VERCEL_DEPLOY_HOOK: en Vercel → Settings → Git →
# Deploy Hooks se crea un enlace y se guarda en GitHub → Settings → Secrets and variables →
# Actions → New repository secret. Sin el secreto, no hace nada.
name: Actualizar documentos de Transparencia

on:
  schedule:
    - cron: '17 9 * * *'   # 06:17 en Chile (horario de verano), todos los días
  workflow_dispatch:

permissions: {}

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pedir a Vercel que publique de nuevo
        env:
          GANCHO: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$GANCHO" ]; then echo "Falta el secreto VERCEL_DEPLOY_HOOK; no se hace nada."; exit 0; fi
          curl -fsS -X POST "$GANCHO" > /dev/null && echo "Publicación solicitada."
