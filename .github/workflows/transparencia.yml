# Actualiza todos los días el inventario del Archivo de Transparencia (carpeta pública
# «LEY DE TRANSPARENCIA» de Google Drive). Si algo cambió, guarda el inventario nuevo y
# Vercel vuelve a publicar el sitio solo. También se puede ejecutar a mano desde la pestaña
# «Actions» de GitHub → «Actualizar archivo de Transparencia» → «Run workflow».
name: Actualizar archivo de Transparencia

on:
  schedule:
    - cron: '17 9 * * *'   # 06:17 en Chile (horario de verano), todos los días
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transparencia
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recorrer la carpeta de Drive
        run: node --no-warnings herramientas/transparencia-drive.js
      - name: Guardar si hubo cambios
        run: |
          if git diff --quiet -- contenido/transparencia/drive.json && ! git ls-files --others --exclude-standard -- contenido/transparencia | grep -q .; then
            echo "Sin cambios en el archivo de Transparencia."
            exit 0
          fi
          git config user.name "Archivo de Transparencia"
          git config user.email "actions@users.noreply.github.com"
          git add contenido/transparencia/drive.json
          git commit -m "Archivo de Transparencia: inventario actualizado desde Google Drive"
          git push
